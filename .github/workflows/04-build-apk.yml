name: 04 - Build do APK (Android)

# Roda automaticamente a cada push que mexer na pasta android/ ou www/, e
# também pode ser disparado manualmente pela aba Actions. Por enquanto só
# valida que o projeto Gradle compila (assembleDebug) e publica o APK de
# debug como artefato do workflow — assinatura + publicação em app/android/
# entram quando o keystore de sideload existir (workflow
# 03-generate-android-keystore.yml).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "www/**"
      - ".github/workflows/04-build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Conferir se assets/content.json está em dia com www/js/data.js
        run: node scripts/generate-content-json.js --check

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão de execução ao gradlew
        working-directory: android/ArtistWayAndroid
        run: chmod +x gradlew

      - name: Rodar os testes unitários (JUnit)
        working-directory: android/ArtistWayAndroid
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar o APK de debug
        working-directory: android/ArtistWayAndroid
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK de debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: artistway-debug-apk
          path: android/ArtistWayAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
