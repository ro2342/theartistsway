name: 03 - Gerar keystore de assinatura Android (rodar uma vez)

# Gera o keystore autoassinado usado pra assinar o APK de release do app
# Android — mesmo modelo do 01-generate-cert.yml (UWP): roda uma vez
# manualmente, o keystore fica commitado no repo. É sideload sem Store e
# sem cadeia de confiança real, então não há necessidade de manter isso
# em segredo (mesma lógica já aplicada ao .pfx do UWP).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (pro keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar se o keystore já existe
        id: check
        run: |
          if [ -f "android/ArtistWayAndroid/app/release.keystore" ]; then
            echo "Keystore já existe — rodar esse workflow de novo geraria uma chave nova e invalidaria updates pra quem já instalou o APK assinado com a atual. Apague o arquivo manualmente antes de rodar de novo, se isso for intencional."
            exit 1
          fi

      - name: Gerar o keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/ArtistWayAndroid/app/release.keystore \
            -alias artistway \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'ArtistWayAndroid2026!' \
            -keypass 'ArtistWayAndroid2026!' \
            -dname "CN=Rod Carvalho, OU=ArtistWay, O=ArtistWay, L=NA, ST=NA, C=BR"

      - name: Mostrar o SHA-1/SHA-256 (precisa pra registrar login Google no Firebase)
        run: |
          keytool -list -v \
            -keystore android/ArtistWayAndroid/app/release.keystore \
            -alias artistway \
            -storepass 'ArtistWayAndroid2026!'

      - name: Exportar o certificado público como artefato (referência, não precisa instalar em nada)
        run: |
          keytool -exportcert -rfc \
            -keystore android/ArtistWayAndroid/app/release.keystore \
            -alias artistway \
            -storepass 'ArtistWayAndroid2026!' \
            -file artistway-android-public-cert.pem

      - name: Publicar o certificado público
        uses: actions/upload-artifact@v4
        with:
          name: artistway-android-public-cert
          path: artistway-android-public-cert.pem

      - name: Commitar o keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ArtistWayAndroid/app/release.keystore
          git commit -m "chore: gera keystore de assinatura Android"
          git push
